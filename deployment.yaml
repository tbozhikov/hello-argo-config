apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-argo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-argo
  template:
    metadata:
      labels:
        app: hello-argo
    spec:
      containers:
      - name: hello-argo
        image: ghcr.io/tbozhikov/hello-argo-app:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: hello-argo-service
spec:
  type: NodePort
  selector:
    app: hello-argo
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
